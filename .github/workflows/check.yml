name: Validate
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libgtk-3-dev libssl-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify package and release manifests with synthetic packages
        run: npm run test:packages
      - name: Verify local packaging and browser workflow helpers
        run: npm run test:workflow
      - name: Verify shared schemas and fixtures
        run: npx tsx scripts/schemas.ts && npx tsx scripts/fixtures.ts && git diff --exit-code -- schemas tests/fixtures
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
