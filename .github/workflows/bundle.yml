name: Desktop bundles
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libgtk-3-dev libssl-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify package and release manifests with synthetic packages
        run: npm run test:packages
      - name: Verify local packaging and browser workflow helpers
        run: npm run test:workflow
      - run: npm run build
      - name: Run Rust tests
        if: runner.os != 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify Windows Rust tests compile
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-run
      - name: Build native desktop packages
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Smoke-check Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = "src-tauri/target/${{ matrix.target }}/release/android-bug-desk.exe"
          if (!(Test-Path -LiteralPath $executable)) {
            throw "Missing Windows application executable: $executable"
          }
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Windows application exited during startup with code $($process.ExitCode)"
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Archive macOS application bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Android Bug Desk.app" "src-tauri/target/${{ matrix.target }}/release/bundle/Android-Bug-Desk-${{ matrix.target }}.app.zip"
      - name: Stage packages and write verified build manifest
        id: manifest
        run: node scripts/build-manifest.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: ${{ steps.manifest.outputs.artifact_path }}/
  release:
    name: Publish official release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: AndroidBugDesk-*
          path: downloaded-artifacts
      - name: Verify and stage official release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-assets.mjs --input downloaded-artifacts --output release-assets --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Android Bug Desk ${RELEASE_TAG#v}" --generate-notes
