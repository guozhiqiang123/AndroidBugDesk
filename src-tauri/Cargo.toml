[package]
name = "android-bug-desk"
version = "0.2.0"
description = "Android QA evidence desktop client"
authors = ["Android QA Team"]
edition = "2021"
rust-version = "1.88"
[lib]
name = "android_bug_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "time", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
regex = "1"
rfd = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "1"
base64 = "0.22"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5"
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
wiremock = "0.6"
[profile.release]
lto = true
codegen-units = 1
strip = true
